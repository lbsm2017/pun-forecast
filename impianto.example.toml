# Esempio di configurazione per "Rete o sole?" (solo flusso locale).
#
# Copia questo file in data/impianto.toml e metti i dati del tuo impianto.
# data/ è ignorata da git: il file vero non finisce mai nel repo né nella pagina pubblica.
# I valori qui sotto sono generici, solo per mostrare il formato.
# Numeri con il punto decimale (0.30, non 0,30): è la sintassi TOML.

# Facoltativo: stato di carica della batteria adesso (0 = vuota, 1 = piena).
# Leggilo dall'app dell'inverter prima di lanciare il calcolo. Predefinito 0.5.
initial_soc = 0.5

[location]
# Posizione dei pannelli in gradi decimali (bastano due decimali, ~1 km).
lat = 45.00
lon = 9.00

[pv]
kwp = 6.0                  # potenza di picco dei pannelli, kWp
tilt_deg = 30              # inclinazione: 0 = orizzontali, 90 = verticali
azimuth_deg = 0            # orientamento: 0 = sud, -90 = est, 90 = ovest (convenzione Open-Meteo)
performance_ratio = 0.85   # perdite di inverter, cavi, temperatura; da tarare con lo storico dell'inverter

[battery]
# Ometti questa sezione se non hai un accumulo.
capacity_kwh = 10.0        # capacità utile
power_kw = 5.0             # potenza massima di carica/scarica
efficiency = 0.9           # rendimento andata e ritorno
min_soc = 0.1              # sotto questa frazione la batteria non si scarica

[tariff]
fixed_price_eur_kwh = 0.30 # prezzo della rete al kWh, tutto incluso (energia, rete, oneri, imposte)
ssp = true                 # scambio sul posto: il kWh immesso vale ~ prezzo orario + CUSf
cusf_eur_kwh = 0.02        # quota servizi di rete restituita con lo scambio sul posto

[base_load]
# Consumo di base medio per ora, in kW, dalle 0 alle 23 (24 valori).
# Ometti la sezione per usare il profilo di una famiglia tipo (~7,7 kWh al giorno).
hourly_kw = [0.20, 0.18, 0.17, 0.17, 0.17, 0.20, 0.30, 0.45, 0.40, 0.30, 0.28, 0.30,
             0.40, 0.35, 0.28, 0.26, 0.28, 0.35, 0.50, 0.60, 0.55, 0.45, 0.35, 0.25]

[decision]
threshold_eur = 0.10       # sotto questa differenza a carico la risposta è "nessuna differenza"
max_wait_days = 3          # attesa massima
margin_day12 = 1.5         # oggi, domani, dopodomani: il surplus previsto deve coprire 1,5 volte il carico
margin_day3 = 2.0          # terzo giorno: previsione più incerta, margine più alto

# Carichi flessibili: energia per ciclo (kWh), durata (ore) e ore ammesse [inizio, fine).
# Il ciclo deve stare tutto dentro le ore ammesse.
[[loads]]
name = "Bucato"
kwh = 1.2
duration_h = 2
allowed_hours = [8, 22]

[[loads]]
name = "Lavastoviglie"
kwh = 1.0
duration_h = 2
allowed_hours = [8, 23]
